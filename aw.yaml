version: 1
intent: kanpou-pdf-ds-pipeline
repository: bonsai/kanpou

objective: >-
  Convert Kanpou PDFs from bonsai/kanpo.json into Markdown and JSON
  through small, replaceable Python transformation steps for DS use.

strategy:
  - prefer_existing_implementations: true
  - official_source_first: true
  - minimal_poc: true
  - keep_transformers_separate: true

workflow:
  - id: pdf2md
    action: transform
    input: PDF
    tool: Python
    output: Markdown
  - id: md2json
    action: transform
    input: Markdown
    tool: Python
    output: normalized-JSON

poc:
  input:
    provider: bonsai/kanpo.json
    format: pdf
  output:
    formats:
      - md
      - json
    downstream: DS

acceptance:
  - PDF can be converted to Markdown by Python
  - Markdown can be converted to JSON by Python
  - source/provenance is retained in JSON
  - transformations remain independently replaceable
